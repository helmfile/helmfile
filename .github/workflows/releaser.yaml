name: GoReleaser

on:
  push:
    tags:
      - 'v0*'
      - 'v1*'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SNAPSHOT: ${{ !startsWith(github.ref, 'refs/tags/v') && '--snapshot' || '' }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check disk usage
        run: df -h
      - name: cleanup disk
        run: |
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -fr /usr/local/lib/android
            sudo rm -fr /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo docker builder prune -a -f
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: check disk usage
        run: df -h
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean ${{ env.SNAPSHOT }}

  # Publish a signed packslip (https://packslip.dev) listing each archive's
  # digest, the helmfile executable inside it, its shell completions, and the
  # skill in skills/helmfile, signed with this workflow's identity so
  # installers can verify a download without a key this project must hold.
  packslip:
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: jdx/packslip@v1
        with:
          download: helmfile_*.tar.gz
          bin: helmfile
          resources: |
            completion/bash,zsh,fish,powershell=exec:helmfile completion {shell}
            skill/helmfile=repo:skills/helmfile
